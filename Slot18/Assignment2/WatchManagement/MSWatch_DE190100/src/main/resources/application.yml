server:
  port: 8083

spring:
  application:
    name: ms-watch

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DBWatch;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD:YourStrong@Password123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

brand-service:
  url: ${BRAND_SERVICE_URL:http://localhost:8082}

saga:
  fault-injection:
    enabled: ${SAGA_FAULT_INJECTION:true}

  compensation:
    max-attempts: 3
    backoff-ms: 1000

logging:
  level:
    com.mss301.watch.service.saga: INFO
    com.mss301.watch.client: DEBUG