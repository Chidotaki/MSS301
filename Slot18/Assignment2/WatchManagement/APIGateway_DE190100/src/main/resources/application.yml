server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # MSAccount
            # =========================
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: accountCB
                    fallbackUri: forward:/fallback/account

            # =========================
            # MSBrand
            # =========================
            - id: brand-service
              uri: ${BRAND_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/brands/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: brandCB
                    fallbackUri: forward:/fallback/brand

            # =========================
            # MSWatch
            # =========================
            - id: watch-service
              uri: ${WATCH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/watches/**,/api/sagas/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: watchCB
                    fallbackUri: forward:/fallback/watch

jwt:
  secret: ${JWT_SECRET:mss301-watch-management-secret-key-2025-very-long-string}

resilience4j:

  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

    instances:
      accountCB:
        base-config: default

      brandCB:
        base-config: default

      watchCB:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 15s

    instances:
      accountCB:
        base-config: default

      brandCB:
        base-config: default

      watchCB:
        base-config: default

logging:
  level:
    org.springframework.cloud.gateway: INFO